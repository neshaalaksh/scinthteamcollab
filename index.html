<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teamspace</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5dfc'/><path d='M28 52l14 14 30-32' stroke='white' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="logo">✓</span>
        <span class="brand-name" id="workspace-name">Teamspace</span>
      </div>
      <nav class="nav">
        <a href="#/home" data-nav="home"><span class="ico">⌂</span>Home</a>
        <a href="#/tasks" data-nav="tasks"><span class="ico">☑</span>Tasks</a>
        <a href="#/daily" data-nav="daily"><span class="ico">↻</span>Daily</a>
        <a href="#/docs" data-nav="docs"><span class="ico">▤</span>Docs</a>
        <div class="nav-sub" id="nav-docs"></div>
        <a href="#/sheets" data-nav="sheets"><span class="ico">▦</span>Sheets</a>
        <div class="nav-sub" id="nav-sheets"></div>
      </nav>
      <div class="sidebar-foot">
        <a href="#/settings" data-nav="settings"><span class="ico">⚙</span>Settings</a>
        <div class="sync" id="sync" title="Sync status">
          <span class="dot"></span><span class="sync-text">…</span>
        </div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">☰</button>
        <h1 id="page-title"></h1>
        <div class="topbar-right">
          <button class="icon-btn" id="refresh-btn" title="Pull latest changes">⟳</button>
          <span id="me-chip"></span>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>
  <div id="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
