<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teamspace</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230F766E'/><path d='M28 52l14 14 30-32' stroke='white' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Sora:wght@600;700&display=swap">
  <link rel="stylesheet" href="vendor/toastui-editor.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
</head>
<body>
  <div id="login" class="login" hidden></div>

  <div id="app" class="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true">S</span>
        <span class="brand-name" id="workspace-name">Teamspace</span>
      </div>
      <label class="space-picker">
        <span>Space</span>
        <select id="space-select" aria-label="Space"></select>
      </label>
      <nav class="nav" id="nav">
        <a href="#/home" data-nav="home">Home</a>
        <a href="#/tasks" data-nav="tasks">Tasks</a>
        <a href="#/calendar" data-nav="calendar">Calendar</a>
        <a href="#/daily" data-nav="daily">Daily</a>
        <a href="#/history" data-nav="history">History</a>
        <a href="#/docs" data-nav="docs">Docs</a>
        <a href="#/sheets" data-nav="sheets">Sheets</a>
        <a href="#/team" data-nav="team" data-admin>Team &amp; roles</a>
      </nav>
      <div class="me" id="me"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">☰</button>
        <h1 id="page-title"></h1>
        <div class="topbar-slot" id="topbar-slot"></div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
